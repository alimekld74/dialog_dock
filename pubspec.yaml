name: dialog_dock
description: >-
  Minimize Flutter dialogs into a floating holder instead of closing them,
  then restore them with their state intact. A drop-in for showDialog.
version: 0.1.0
repository: https://github.com/alimekld74/dialog_dock
issue_tracker: https://github.com/alimekld74/dialog_dock/issues
topics:
  - dialog
  - window
  - overlay
  - desktop
  - widget

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.1
  collection: ^1.19.0
  equatable: ">=2.0.7 <4.0.0"
  flutter_bloc: ^9.1.0
  meta: ^1.15.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  shared_preferences: ^2.5.3
